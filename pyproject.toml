[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flyhire"
version = "0.1.0"
description = "Hortum Uzatma Kariyer Danışmanlığı: iş ilanlarına bir meyve sineği beyni simülasyonu karar veriyor."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "MIT" }
authors = [{ name = "İbrahim Güldemir" }]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6",
    "typer>=0.12",
    "httpx>=0.27",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "pgvector>=0.3",
    "alembic>=1.13",
]

[project.optional-dependencies]
# Faz 1: sinek beyni. torch CPU sürümü ayrıca kurulur (bkz. environment.yml).
brain = ["brian2>=2.7", "torch>=2.3", "scipy>=1.12", "matplotlib>=3.8"]
# Faz 2: ilan toplama
ingest = ["google-api-python-client>=2.130", "google-auth-oauthlib>=1.2", "feedparser>=6", "trafilatura>=1.9", "apscheduler>=3.10,<4"]
# Faz 2: LLM ve embedding (sağlayıcıdan bağımsız)
llm = ["instructor>=1.4", "anthropic", "openai", "sentence-transformers>=3"]
# Faz 4: panel
app = ["streamlit>=1.36", "plotly>=5.22"]
# Faz 3/5: kalibrasyon ve değerlendirme
eval = ["scikit-learn>=1.5", "mlflow>=2.14"]
dev = ["pytest>=8", "ruff>=0.5", "pre-commit>=3.7"]

[project.scripts]
flyhire = "flyhire.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: tam beyin simülasyonu gerektiren uzun testler (Colab veya uzun CPU koşusu)"]
addopts = "-m 'not slow'"
filterwarnings = ["ignore::DeprecationWarning:brian2.*", "ignore::DeprecationWarning:pyparsing.*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]
